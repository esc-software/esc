name: Bug report
description: Something on the site or in the build does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For security problems, do **not** use this form: see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see, and what did you expect to see instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See the problem
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page or URL
      placeholder: https://esc-software.com/
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Chrome 141 on Windows 11, or Safari on iPhone 15
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, console output, anything else
