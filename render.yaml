# Render blueprint for the static site. For a service that already exists,
# set the same values in the dashboard (Settings and Headers).
services:
  - type: web
    runtime: static
    name: esc-website
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 22
      # Optional, inlined into the bundle at build time. Never put secrets here.
      - key: VITE_CONTACT_BASE_URL
        sync: false
      - key: VITE_CHATBOT_BASE_URL
        sync: false
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /sw.js
        name: Cache-Control
        value: no-cache
