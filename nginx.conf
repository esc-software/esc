# Mirrors the behavior of the production host (Render static site):
# real 404 status with the themed 404.html, long cache for hashed assets,
# and a service worker file that is always revalidated.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
  gzip_min_length 1024;

  error_page 404 /404.html;

  location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "public, max-age=0, must-revalidate";
  }

  # Vite emits content-hashed file names, so these never change.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  location = /404.html {
    internal;
  }
}
